version: "3.9"

# =============================================================================
# HNG Anomaly Detection Stack
#
# Services:
#   nginx      — reverse proxy; writes JSON logs to HNG-nginx-logs volume
#   nextcloud  — pre-built image from DockerHub (do not modify)
#   db         — MariaDB backend for Nextcloud
#   detector   — Python anomaly detection daemon
#
# Volumes:
#   HNG-nginx-logs — named volume shared between nginx (rw) and detector (ro)
#   nextcloud_data — Nextcloud data persistence
#   db_data        — MariaDB data persistence
# =============================================================================

services:

  # --------------------------------------------------------------------------
  # MariaDB — Nextcloud database backend
  # --------------------------------------------------------------------------
  db:
    image: mariadb:10.11
    container_name: hng-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:-nextcloudpass}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - hng-net

  # --------------------------------------------------------------------------
  # Nextcloud — do NOT modify this image
  # --------------------------------------------------------------------------
  nextcloud:
    image: kefaslungu/hng-nextcloud:latest
    container_name: hng-nextcloud
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:-nextcloudpass}
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-adminpassword}
      NEXTCLOUD_TRUSTED_DOMAINS: ${SERVER_IP:-localhost}
    volumes:
      - nextcloud_data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro   # read-only mount of nginx logs
    networks:
      - hng-net

  # --------------------------------------------------------------------------
  # Nginx — reverse proxy with JSON access logging
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: hng-nginx
    restart: unless-stopped
    depends_on:
      - nextcloud
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx:rw   # writes JSON logs here
    networks:
      - hng-net

  # --------------------------------------------------------------------------
  # Detector — Python anomaly detection daemon
  # --------------------------------------------------------------------------
  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    container_name: hng-detector
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro   # reads nginx logs
      - detector_logs:/var/log/detector    # audit log output
    ports:
      - "8080:8080"   # metrics dashboard
    networks:
      - hng-net
    # The daemon needs cap_net_admin to run iptables on the HOST network.
    # We use network_mode: host for the detector so iptables rules affect
    # the host firewall (not just the container network).
    # NOTE: When network_mode is host, the ports mapping above is ignored;
    #       the service binds directly on host port 8080.
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW

# =============================================================================
# Named volumes
# =============================================================================
volumes:
  HNG-nginx-logs:
    name: HNG-nginx-logs
  nextcloud_data:
  db_data:
  detector_logs:

# =============================================================================
# Networks
# =============================================================================
networks:
  hng-net:
    driver: bridge
