version: "3.9"

# =============================================================================
# HNG Anomaly Detection Stack
#
# Services:
#   nginx      — reverse proxy; writes JSON logs to HNG-nginx-logs volume
#   nextcloud  — pre-built image from DockerHub (do not modify)
#   db         — MariaDB backend for Nextcloud
#   detector   — Python anomaly detection daemon
#
# Volumes:
#   HNG-nginx-logs — named volume shared between nginx (rw) and detector (ro)
#   nextcloud_data — Nextcloud data persistence
#   db_data        — MariaDB data persistence
# =============================================================================

services:

  db:
    image: mariadb:10.11
    container_name: hng-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:-nextcloudpass}
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - hng-net

  nextcloud:
    image: kefaslungu/hng-nextcloud:latest
    container_name: hng-nextcloud
    restart: unless-stopped
    depends_on:
      - db
    environment:
      MYSQL_HOST: db
      MYSQL_DATABASE: nextcloud
      MYSQL_USER: nextcloud
      MYSQL_PASSWORD: ${DB_PASSWORD:-nextcloudpass}
      NEXTCLOUD_ADMIN_USER: ${NC_ADMIN_USER:-admin}
      NEXTCLOUD_ADMIN_PASSWORD: ${NC_ADMIN_PASSWORD:-adminpassword}
      NEXTCLOUD_TRUSTED_DOMAINS: ${SERVER_IP:-localhost}
    volumes:
      - nextcloud_data:/var/www/html
      - HNG-nginx-logs:/var/log/nginx:ro
    networks:
      - hng-net

  nginx:
    image: nginx:1.25-alpine
    container_name: hng-nginx
    restart: unless-stopped
    depends_on:
      - nextcloud
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - HNG-nginx-logs:/var/log/nginx:rw
    networks:
      - hng-net

  detector:
    build:
      context: ./detector
      dockerfile: Dockerfile
    container_name: hng-detector
    restart: unless-stopped
    depends_on:
      - nginx
    environment:
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
    volumes:
      - HNG-nginx-logs:/var/log/nginx:ro
      - detector_logs:/var/log/detector
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_RAW

volumes:
  HNG-nginx-logs:
    name: HNG-nginx-logs
  nextcloud_data:
  db_data:
  detector_logs:

networks:
  hng-net:
    driver: bridge