# nginx.conf
# Reverse proxy in front of Nextcloud with:
#   - JSON structured access logs written to the shared volume
#   - Real client IP forwarding via X-Forwarded-For
#   - Trusted proxy set to Docker network range

user  nginx;
worker_processes  auto;
error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # ------------------------------------------------------------------
    # Real IP configuration
    # Trust the Docker internal network so X-Forwarded-For carries the
    # actual client IP rather than the internal gateway address.
    # ------------------------------------------------------------------
    set_real_ip_from  172.16.0.0/12;
    set_real_ip_from  10.0.0.0/8;
    set_real_ip_from  192.168.0.0/16;
    real_ip_header    X-Forwarded-For;
    real_ip_recursive on;

    # ------------------------------------------------------------------
    # JSON access log format
    # Fields required by the task spec (minimum):
    #   source_ip, timestamp, method, path, status, response_size
    # ------------------------------------------------------------------
    log_format hng_json escape=json
        '{'
            '"source_ip":"$remote_addr",'
            '"timestamp":"$time_iso8601",'
            '"method":"$request_method",'
            '"path":"$uri",'
            '"query":"$args",'
            '"status":$status,'
            '"response_size":$body_bytes_sent,'
            '"request_time":$request_time,'
            '"http_referer":"$http_referer",'
            '"http_user_agent":"$http_user_agent",'
            '"http_x_forwarded_for":"$http_x_forwarded_for"'
        '}';

    # Write JSON log to the shared volume path
    access_log  /var/log/nginx/hng-access.log  hng_json;

    sendfile        on;
    keepalive_timeout  65;
    client_max_body_size 512M;

    # ------------------------------------------------------------------
    # Upstream: Nextcloud container
    # ------------------------------------------------------------------
    upstream nextcloud {
        server nextcloud:80;
    }

    server {
        listen 80;
        server_name _;

        # Pass real IP to Nextcloud
        proxy_set_header  Host              $host;
        proxy_set_header  X-Real-IP         $remote_addr;
        proxy_set_header  X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto $scheme;

        # Nextcloud-recommended headers
        add_header Strict-Transport-Security "max-age=15768000; includeSubDomains; preload" always;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "no-referrer" always;

        location / {
            proxy_pass         http://nextcloud;
            proxy_read_timeout 300;
            proxy_connect_timeout 300;
            proxy_send_timeout 300;

            # Required for Nextcloud file uploads
            proxy_request_buffering off;
        }

        # Block access to .ht files
        location ~ /\.ht {
            deny all;
        }
    }
}
